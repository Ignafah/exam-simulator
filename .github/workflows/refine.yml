name: Refine idea

on:
  issues:
    types: [opened, labeled]

jobs:
  refine:
    # Conditions de déclenchement (toujours : interrupteur général actif ET action faite par TOI) :
    # - une issue est créée avec le label "idea" (template Idée) -> raffinement automatique ;
    # - OU tu poses le label "refine" -> nouveau raffinement après tes commentaires.
    if: |
      vars.AUTOMATION_ENABLED == 'true' &&
      github.event.sender.login == github.repository_owner &&
      (
        (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'idea')) ||
        (github.event.action == 'labeled' && github.event.label.name == 'refine')
      )
    # Un seul raffinement à la fois par issue (au niveau du job : un label sans rapport
    # posé pendant le raffinement ne l'annule pas). Un nouveau raffinement attend son tour.
    concurrency:
      group: refine-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read      # lecture seule : aucune modification du code possible
      issues: write       # pour commenter et changer les labels
      id-token: write
    env:
      ISSUE: ${{ github.event.issue.number }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refine with Claude
        # On ne s'arrête pas ici en cas d'erreur : c'est l'étape "Verify outcome" qui juge le résultat.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model ${{ vars.MODEL_PLANNING || 'opus' }}
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Write,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh issue edit:*)"
          prompt: |
            Tu es l'agent analyste du projet décrit dans CLAUDE.md.
            Lis d'abord et applique le skill .claude/skills/spec-writing/SKILL.md.
            Ta mission : transformer l'idée de l'issue #${{ github.event.issue.number }} en spécification.

            1. Lis CLAUDE.md en entier.
            2. Lis l'issue et tous ses commentaires : gh issue view ${{ github.event.issue.number }} --comments
               Si des commentaires du mainteneur répondent à une spec précédente, ils font foi.
               Si l'issue cite un ticket parent, lis-le aussi avec ses commentaires.
            3. Pour repérer les tickets existants ou liés : gh issue list --state all --limit 50
            4. Lis le code existant concerné.
            5. N'écris AUCUN code et ne modifie AUCUN fichier du projet.

            Rédige la spec dans le fichier /tmp/spec.md avec exactement ces sections :

            ## Résumé (2 lignes, compréhensibles par un débutant)
            ## Problème métier
            ## Valeur attendue (pour qui, quel gain)
            ## Avis critique
            Dis clairement si l'idée est redondante, surdimensionnée, prématurée vu l'état du projet,
            ou de faible valeur. Si elle dépend d'un autre ticket non fait, dis lequel.
            ## Hors périmètre
            ## Critères d'acceptation
            Format Given / When / Then.
            - Ce qui peut régresser au fil des tickets (comportement, règles) : test automatisé.
            - Ce qui est posé une seule fois (contenu d'un fichier de configuration, liste de dépendances,
              manifeste) : marque-le "vérification manuelle en review". Ne propose JAMAIS de script ou de test
              qui lit des fichiers de configuration pour les vérifier.
            ## Approche technique
            Couches et fichiers concernés, en respectant CLAUDE.md. Une alternative écartée et pourquoi.
            Liste les commandes et dépendances nécessaires (npm, dotnet, outils de génération).
            ## Hypothèses
            Liste numérotée. Chaque hypothèse que tu as faite faute d'information.
            ## Questions ouvertes
            Liste numérotée. Ne tranche pas seul ce qui relève d'un choix du mainteneur.
            ## Risques
            Sécurité, données, migration, performance, contenu (voir section 8 de CLAUDE.md).
            ## Taille : S, M ou L
            Si L : propose un découpage en sous-tickets de taille S ou M, dans l'ordre.

            Règles :
            - Si tu n'as aucune hypothèse ni question ouverte, relis : c'est presque toujours une erreur.
            - Écris en français simple, le mainteneur débute.

            Enfin :
            - gh issue comment ${{ github.event.issue.number }} --body-file /tmp/spec.md
            - gh issue edit ${{ github.event.issue.number }} --add-label to-validate
            - Si le label refine est présent : gh issue edit ${{ github.event.issue.number }} --remove-label refine

      # Détection des échecs silencieux : la spec doit avoir été postée (label to-validate).
      - name: Verify outcome
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | join(",")')

          if echo ",$LABELS," | grep -q ",to-validate,"; then
            echo "OK : spec postée, label to-validate présent."
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue edit "$ISSUE" --add-label needs-human
          gh issue edit "$ISSUE" --remove-label refine || true
          gh issue comment "$ISSUE" --body "L'agent de raffinement s'est arrêté sans poster de spec. Intervention nécessaire. Journal : $RUN_URL"
          echo "ÉCHEC : pas de spec postée."
          exit 1
