name: Claude (mention)

on:
  issue_comment:
    types: [created]

jobs:
  claude:
    # Ne réagit qu'aux commentaires contenant @claude ET écrits par toi (propriétaire du repo).
    # Empêche quelqu'un d'autre de déclencher l'agent et de consommer ta clé API.
    if: |
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --max-turns 10
