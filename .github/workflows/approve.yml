name: Approve spec

# Workflow sans IA : il traduit ta validation (label "approved") en lancement de l'agent.
on:
  issues:
    types: [labeled]

jobs:
  approve:
    # Conditions : interrupteur général actif, label "approved", posé par TOI.
    if: |
      vars.AUTOMATION_ENABLED == 'true' &&
      github.event.label.name == 'approved' &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ISSUE: ${{ github.event.issue.number }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Le jeton de l'application est indispensable : un label posé avec le jeton par défaut
      # ne déclencherait pas le workflow "Implement ticket".
      - name: Generate agent token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Check and hand over to the implementation agent
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | join(",")')

          # Garde-fou : on ne valide qu'une issue dont la spec a été postée.
          if ! echo ",$LABELS," | grep -q ",to-validate,"; then
            gh issue edit "$ISSUE" --remove-label approved || true
            gh issue comment "$ISSUE" --body "Validation ignorée : aucune spec en attente de validation (label to-validate absent). Lance d'abord le raffinement (label refine)."
            echo "Pas de label to-validate : rien à faire."
            exit 0
          fi

          # Les labels décrivent l'état actuel ; l'historique reste visible dans la chronologie de l'issue.
          gh issue edit "$ISSUE" --remove-label to-validate --remove-label approved
          gh issue edit "$ISSUE" --add-label ready-for-agent
          echo "Spec validée : ready-for-agent posé, l'agent d'implémentation va démarrer."
