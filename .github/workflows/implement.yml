name: Implement ticket

on:
  issues:
    types: [labeled]

# Une seule implémentation à la fois (WIP = 1). Les suivantes attendent leur tour.
concurrency:
  group: implement-agent
  cancel-in-progress: false

jobs:
  implement:
    # Conditions de déclenchement :
    # - l'interrupteur général AUTOMATION_ENABLED vaut "true" (variable du repo) ;
    # - le label posé est "ready-for-agent" ;
    # - posé par TOI, ou par l'application de l'agent (workflow "Approve spec" ou futur planificateur).
    if: |
      vars.AUTOMATION_ENABLED == 'true' &&
      github.event.label.name == 'ready-for-agent' &&
      (
        github.event.sender.login == github.repository_owner ||
        github.event.sender.login == vars.AGENT_BOT_LOGIN
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    env:
      ISSUE: ${{ github.event.issue.number }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Jeton de l'application GitHub de l'agent.
      # Contrairement au jeton par défaut, ses actions (PR, push, labels) déclenchent les autres
      # workflows : la CI démarre donc toute seule sur la PR de l'agent.
      # L'application n'a pas la permission "Workflows" : elle ne peut pas modifier .github/workflows/.
      - name: Generate agent token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Implement with Claude
        # On ne s'arrête pas ici en cas d'erreur : c'est l'étape "Verify outcome" qui juge le résultat.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Par défaut, l'action refuse de tourner si l'événement vient d'un bot.
          # Ici, le label ready-for-agent est posé par l'application de l'agent (approve.yml).
          # "*" est sûr dans ce cas : la condition "if" du job n'accepte déjà que TOI ou TON application.
          allowed_bots: "*"
          claude_args: >-
            --max-turns 100
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(mkdir:*),Bash(dotnet:*),Bash(npm ci:*),Bash(npm install:*),Bash(npm create vite:*),Bash(npm run:*),Bash(npx @vite-pwa/assets-generator:*),Bash(npx pwa-assets-generator:*),Bash(npx tsc:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git switch:*),Bash(git add:*),Bash(git mv:*),Bash(git rm:*),Bash(git commit:*),Bash(git push:*),Bash(git check-ignore:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr create:*)"
          prompt: |
            Tu es développeur sur le projet décrit dans CLAUDE.md.
            Ta mission : implémenter l'issue #${{ github.event.issue.number }}.

            ## Préparation
            1. Lis CLAUDE.md en entier et respecte-le.
            2. Lis l'issue et TOUS ses commentaires :
               gh issue view ${{ github.event.issue.number }} --comments
               Le contrat = la spec de l'analyste + les réponses du mainteneur.
               En cas de contradiction, les réponses du mainteneur font foi.
            3. Crée ta branche : git switch -c ai/issue-${{ github.event.issue.number }}

            ## Réalisation
            4. Écris d'abord les tests dérivés des critères d'acceptation, puis le code.
            5. Reste strictement dans le périmètre. Aucune dépendance hors de celles autorisées.
            6. N'utilise jamais "cd dossier && commande". Utilise des chemins :
               dotnet build backend / dotnet test backend
               npm ci --prefix <dossier> / npm run build --prefix <dossier>
               npm run lint --prefix <dossier> / npm run test --prefix <dossier>
               (<dossier> = legacy ou frontend selon ce que le ticket touche)
               Pour créer un projet ou ajouter un paquet : npm create vite / npm install --prefix <dossier>,
               uniquement avec les paquets autorisés par le ticket.
            7. Toutes les commandes concernées doivent réussir avant d'ouvrir la PR.

            ## Nettoyage avant livraison (obligatoire)
            8. Supprime avec git rm (ne te contente pas de les vider) :
               - les fichiers générés par les modèles de projet et inutilisés (Class1.cs, UnitTest1.cs, etc.) ;
               - tout fichier temporaire créé pour une vérification (par exemple une violation volontaire de règle).
            9. Aucun fichier vide et aucun test qui ne vérifie rien (méthode de test sans assertion) dans le diff.
            10. Relis ton diff (git diff main) critère par critère, puis vérifie git status.

            ## Livraison
            11. Commits clairs, puis : git push -u origin ai/issue-${{ github.event.issue.number }}
            12. Écris la description de PR dans /tmp/pr.md avec le modèle de CLAUDE.md section 11.
                Pour CHAQUE critère d'acceptation : le test qui le couvre, ou la vérification
                manuelle que le mainteneur doit faire (et comment la faire, en termes simples).
                Dans "Dépendances ajoutées" : déclare TOUT écart à la liste autorisée par le ticket
                (même une dépendance obligatoire d'un paquet autorisé), avec sa raison.
            13. gh pr create --draft --base main --head ai/issue-${{ github.event.issue.number }} --title "<titre clair>" --body-file /tmp/pr.md
            14. gh issue comment ${{ github.event.issue.number }} --body "PR ouverte : <lien de la PR>"
            15. gh issue edit ${{ github.event.issue.number }} --remove-label ready-for-agent

            ## Quand t'arrêter SANS ouvrir de PR
            - Contradiction entre le ticket, CLAUDE.md et le code.
            - Information manquante pour un choix métier ou technique.
            - Besoin d'une dépendance non autorisée.
            - Une commande échoue encore après 3 tentatives de correction.
            - Une commande dont tu as besoin t'est refusée (permission).
            Dans ce cas : explique précisément le blocage en commentaire sur l'issue
            (ce qui est fait, ce qui bloque, la question), puis
            gh issue edit ${{ github.event.issue.number }} --remove-label ready-for-agent --add-label needs-clarification

            ## Interdits absolus
            Pousser sur main, modifier CLAUDE.md ou .github/, désactiver ou affaiblir un test,
            ajouter NoWarn ou #pragma warning disable sans justification écrite dans la PR.

      # Détection des échecs silencieux : l'agent doit avoir produit une PR
      # OU posé needs-clarification. Sinon, on alerte le mainteneur.
      - name: Verify outcome
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_URL=$(gh pr list --head "ai/issue-$ISSUE" --state all --json url --jq '.[0].url // ""')
          LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | join(",")')

          if [ -n "$PR_URL" ]; then
            echo "OK : PR trouvée : $PR_URL"
            exit 0
          fi

          if echo ",$LABELS," | grep -q ",needs-clarification,"; then
            echo "OK : l'agent a demandé une clarification sur l'issue."
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue edit "$ISSUE" --add-label needs-human
          gh issue edit "$ISSUE" --remove-label ready-for-agent || true
          gh issue comment "$ISSUE" --body "L'agent d'implémentation s'est arrêté sans ouvrir de PR ni poser de question. Intervention nécessaire. Journal : $RUN_URL"
          echo "ÉCHEC : ni PR, ni demande de clarification."
          exit 1
